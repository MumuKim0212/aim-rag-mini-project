# Baseline configuration (submission/PLAN.md §3.1). Every experiment starts from this file.
# A variant is a separate file that names this one with `base:` and lists ONLY the keys it changes;
# see configs/README.md. Do not edit values here after the baseline run — that changes every comparison.

name: 000_baseline
card: null
description: Recursive 800/100, vector k=5, gemini-3.5-flash-lite, shared answer prompt

system: rag                     # rag | agent

corpus:
  pdf_dir: 01_data
  pages: corpus/pages.jsonl     # committed page extraction; everyone chunks the same text
  exclude_pages:                # file -> [first, last] pages (1-based) not indexed
    financial_glossary_readable.pdf: [20, 25]   # URL source list, not content
    # standard terms: each PDF ends with a "출처 목록" (article title + URL per line), starting on its own page
    01_매매거래계좌설정약관.pdf: [7, 8]
    02_파생상품계좌설정약관.pdf: [12, 13]
    03_외화증권매매거래계좌설정약관.pdf: [7, 7]
    04_신용거래약관.pdf: [7, 7]
    05_증권대차거래약관.pdf: [8, 8]
    06_연금저축계좌설정약관.pdf: [11, 12]
    07_대고객환매조건부매매약관.pdf: [5, 5]
    08_기관간환매조건부매매약관.pdf: [11, 11]
    09_기업어음증권거래약관.pdf: [4, 4]
    10_전자금융거래 이용에 관한 기본약관.pdf: [7, 7]
    11_외국집합투자증권 매매거래에 관한 표준약관.pdf: [6, 7]
    12_수익증권저축약관.pdf: [7, 8]
    13_해외파생상품시장거래중개계좌설정약관.pdf: [6, 6]
    14_해외파생상품시장거래총괄계좌설정약관.pdf: [7, 8]
    15_유사해외통화선물(FX Margin Trading) 거래약관.pdf: [6, 6]
  scopes:                       # file patterns, relative to pdf_dir
    A: [financial_glossary_readable.pdf, "standard_terms/*.pdf"]
    B: ["*.pdf", "*/*.pdf"]
  titles:                       # document titles for embedding text; unlisted files: name without "NN_" and ".pdf"
    financial_glossary_readable.pdf: 금융용어 모음
    financial_life_guide.pdf: 20대를 위한 금융생활 가이드북
    housing_pension_2026.pdf: 2026 주택연금 백문백답
    housing_policy_finance_2025.pdf: 우리나라 주택 정책금융 현황과 평가
    insurance_terms_example_2020.pdf: 보험약관 이해 가이드북
    policy_finance_debt_adjustment_2026.pdf: 정책서민금융 및 채무조정제도 분석
    retirement_pension_2025.pdf: 퇴직연금 보도자료 2025
    self_employed_debt_2025.pdf: 최근 자영업자의 채무상환능력 평가 및 시사점
  set_scope:                    # golden `set` -> index scope
    base_positive: A
    base_negative: A
    life_guide: B
    additional: B
    self: B

chunking:
  method: recursive             # recursive | structure
  chunk_size: 800               # characters
  chunk_overlap: 100
  add_header: false             # prefix each chunk with document title / section heading

embedding:
  model: gemini-embedding-2
  dimensions: 3072
  task_type: null               # gemini-embedding-001 only: "retrieval" -> RETRIEVAL_QUERY / RETRIEVAL_DOCUMENT
  text_format: gemini2_qa       # gemini-embedding-2 has no task_type; the docs prescribe text prefixes instead:
                                #   query "task: question answering | query: …", document "title: … | text: …"
                                # none = embed raw text. Only the vectors change; chunk content is unchanged.

retrieval:
  method: vector                # vector | bm25 | hybrid
  k: 5
  mmr: false
  mmr_lambda: 0.5
  hybrid_alpha: 0.5             # weight of the vector score in hybrid fusion
  bm25_tokenizer: kiwi

answer:
  model: gemini-3.5-flash-lite  # baseline answer model (2026-10-20); card 007 compares 3.1-flash-lite and 3.8-flash
  prompt: prompts/answer_v1.md
  temperature: 0                # ignored by gemini-3.5-flash-lite and gemini-3.6-flash (fixed sampling): measure answer noise (step 3a)
  thinking_level: low           # low | high; verified 2026-10-20 on all four candidates (submission/PROCESS.md §0)

agent:                          # used when system: agent
  max_research: 2
  max_cite_retry: 1
  node_models:                  # null = answer.model
    classify: null
    grade: null
    rewrite: null

judge:
  model: gemini-3.6-flash       # fixed for the whole project; never one of the answer candidates
  prompt: prompts/judge_v1.md
  temperature: 0                # ignored by gemini-3.6-flash: judge noise must be measured (workflow step 3b)
  thinking_level: low           # structured grading used ~1 thinking token/call (270 calls, 293 tokens; PROCESS.md §0); billed as output

run:
  concurrency: 4
  timeout_s: 120
  max_retries: 2
